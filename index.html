<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<script>
  // Apply saved theme before first paint (no flash)
  try { document.documentElement.dataset.theme = localStorage.getItem('sf_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
</script>
<style>
/* ---------- Theme tokens ---------- */
:root,
[data-theme="dark"] {
  --bg: #090b13;
  --panel: #0f1322;
  --text: #e9edf7;
  --muted: #8b93a7;
  --field: #111528;
  --field-border: #2a3050;
  --cyan: #00f0ff;
  --pink: #ff2bd6;
  --on-neon: #03131a;
  --glow-cyan: 0 0 10px rgba(0, 240, 255, .55), 0 0 26px rgba(0, 240, 255, .25);
  --glow-pink: 0 0 10px rgba(255, 43, 214, .55), 0 0 26px rgba(255, 43, 214, .25);
  --error: #ff6b86;
}

[data-theme="light"] {
  --bg: #f4f6fc;
  --panel: #e4e8f6;
  --text: #11141f;
  --muted: #566078;
  --field: #ffffff;
  --field-border: #b9c1da;
  --cyan: #00c8e6;
  --pink: #e01bbd;
  --on-neon: #04121a;
  --glow-cyan: 0 0 8px rgba(0, 200, 230, .45), 0 0 20px rgba(0, 200, 230, .18);
  --glow-pink: 0 0 8px rgba(224, 27, 189, .4), 0 0 20px rgba(224, 27, 189, .15);
  --error: #d6284a;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  line-height: 1.5;
  transition: background .3s ease, color .3s ease;
}
h1, h2 { margin: 0; line-height: 1.15; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

/* ---------- Sign in layout ---------- */
.auth {
  position: relative;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
}
.curve {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
.curve__fill { fill: var(--panel); transition: fill .3s ease; }
.curve__line {
  fill: none;
  stroke: var(--pink);
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 6px var(--pink));
}
.auth__left, .auth__right {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 24px;
}
.auth__right { padding-left: 12%; }

.form {
  width: min(380px, 100%);
  display: flex; flex-direction: column; align-items: center; gap: 22px;
}
.form h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: .01em; }
.field { width: 100%; }
.input {
  width: 100%;
  padding: 16px 18px;
  font: inherit;
  color: var(--text);
  background: var(--field);
  border: 2px solid var(--field-border);
  border-radius: 14px;
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .3s ease;
}
.input::placeholder { color: var(--muted); }
.input:hover { transform: scale(1.03); }
.input:focus { outline: none; border-color: var(--cyan); box-shadow: var(--glow-cyan); }
.input[aria-invalid="true"] { border-color: var(--error); }

.error { min-height: 1.3em; margin: 6px 4px 0; font-size: .85rem; color: var(--error); }

.forgot { color: var(--muted); font-size: .95rem; text-decoration: none; transition: color .2s ease; }
.forgot:hover { color: var(--cyan); text-decoration: underline; }

.message { min-height: 1.3em; margin: -8px 0 0; font-size: .9rem; text-align: center; color: var(--error); }
.message.is-info { color: var(--cyan); }

.welcome {
  width: min(340px, 100%);
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  text-align: center;
}
.welcome h2 { font-size: 2.2rem; }
.welcome p { margin: 0 0 20px; color: var(--muted); font-size: 1.05rem; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 170px;
  padding: 14px 34px;
  font: 600 1.05rem/1 inherit;
  font-family: inherit;
  text-decoration: none;
  cursor: pointer;
  border-radius: 14px;
  border: 2px solid transparent;
  transition: transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
}
.btn:hover { transform: scale(1.07); }
.btn:active { transform: scale(1.02); }
.btn:disabled { opacity: .6; cursor: wait; transform: none; }

.btn--primary {
  background: var(--cyan); border-color: var(--cyan);
  color: var(--on-neon); box-shadow: var(--glow-cyan);
}
.btn--alt {
  background: transparent; border-color: var(--pink);
  color: var(--pink); box-shadow: var(--glow-pink);
}
.btn--alt:hover { background: var(--pink); color: #fff; }

/* ---------- Theme toggle ---------- */
.theme-toggle {
  position: fixed; right: 20px; bottom: 20px; z-index: 10;
  width: 52px; height: 52px; padding: 0;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  background: var(--field);
  overflow: hidden; cursor: pointer;
  box-shadow: var(--glow-cyan);
  transition: transform .25s ease;
}
.theme-toggle:hover { transform: scale(1.1); }
.theme-toggle img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* ---------- Mobile ---------- */
@media (max-width: 800px) {
  .auth { grid-template-columns: 1fr; }
  .curve { display: none; }
  .auth__left { padding-bottom: 32px; }
  .auth__right {
    padding: 40px 24px 96px;
    background: var(--panel);
    border-top: 3px solid var(--pink);
    border-radius: 48px 48px 0 0;
    box-shadow: 0 -6px 24px -10px var(--pink);
  }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body data-page="signin" data-auth="guest">

  <main class="auth">
    <!-- Curved divider (matches the wireframe) -->
    <svg class="curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="curve__fill" d="M98,0 C70,8 47,30 47,53 C47,75 58,90 64,100 L100,100 L100,0 Z"/>
      <path class="curve__line" d="M98,0 C70,8 47,30 47,53 C47,75 58,90 64,100"/>
    </svg>

    <section class="auth__left">
      <form id="signin-form" class="form" novalidate>
        <h1>Sign in</h1>

        <div class="field">
          <label for="email" class="sr-only">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
          <p class="error" id="email-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="password" class="sr-only">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
          <p class="error" id="password-error" role="alert"></p>
        </div>

        <a href="#" id="forgot-link" class="forgot">Forgot Your Password?</a>

        <p class="message" id="form-message" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn--primary" id="signin-btn">Sign in</button>
      </form>
    </section>

    <section class="auth__right">
      <div class="welcome">
        <h2>Welcome!</h2>
        <p>Log in to your account or create one</p>
        <a href="signup.html" class="btn btn--alt">Sign up</a>
      </div>
    </section>
  </main>

  <button type="button" class="theme-toggle" id="theme-toggle">
    <img id="theme-toggle-img" src="Sun.jpeg" alt="">
  </button>

<script>
'use strict';

/* =====================================================================
   Storage: localStorage (works without a server).
     sf_users   -> array of accounts { id, name, email, salt, hash, createdAt }
     sf_session -> currently logged-in user { id, email, name }
     sf_theme   -> "dark" | "light"
   ===================================================================== */
const SF = (() => {
  const KEYS = { users: 'sf_users', session: 'sf_session', theme: 'sf_theme' };
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const MIN_PASSWORD = 8;

  const read = (key, fallback) => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch { return fallback; }
  };
  const write = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch { return false; }
  };

  const toHex = (bytes) => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');

  async function hashPassword(password, salt) {
    if (!(window.crypto && crypto.subtle)) {
      throw new Error('Secure context required. Open the site via localhost (e.g. VS Code Live Server).');
    }
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' }, key, 256);
    return toHex(new Uint8Array(bits));
  }

  const normalizeEmail = (email) => String(email || '').trim().toLowerCase();
  const isValidEmail = (email) => EMAIL_RE.test(normalizeEmail(email));

  const getUsers = () => read(KEYS.users, []);

  async function registerUser({ name = '', email, password }) {
    email = normalizeEmail(email);
    if (!isValidEmail(email)) return { ok: false, error: 'Enter a valid email address.' };
    if (String(password || '').length < MIN_PASSWORD) {
      return { ok: false, error: `Password must be at least ${MIN_PASSWORD} characters.` };
    }
    const users = getUsers();
    if (users.some(u => u.email === email)) return { ok: false, error: 'An account with this email already exists.' };

    try {
      const saltBytes = new Uint8Array(16);
      crypto.getRandomValues(saltBytes);
      const salt = toHex(saltBytes);
      const user = {
        id: 'u_' + Date.now().toString(36) + toHex(saltBytes.slice(0, 3)),
        name: String(name).trim(), email, salt,
        hash: await hashPassword(password, salt),
        createdAt: new Date().toISOString()
      };
      users.push(user);
      if (!write(KEYS.users, users)) return { ok: false, error: 'Could not save the account. Check that browser storage is enabled.' };
      return { ok: true, user: { id: user.id, email: user.email, name: user.name } };
    } catch (err) {
      return { ok: false, error: err.message };
    }
  }

  async function login(email, password) {
    email = normalizeEmail(email);
    const genericError = { ok: false, error: 'Incorrect email or password.' };
    const user = getUsers().find(u => u.email === email);
    if (!user) return genericError;
    try {
      const hash = await hashPassword(password, user.salt);
      if (hash !== user.hash) return genericError;
    } catch (err) {
      return { ok: false, error: err.message };
    }
    const session = { id: user.id, email: user.email, name: user.name };
    if (!write(KEYS.session, session)) return { ok: false, error: 'Could not start a session. Check that browser storage is enabled.' };
    return { ok: true, user: session };
  }

  function currentUser() {
    const s = read(KEYS.session, null);
    if (!s) return null;
    return getUsers().some(u => u.id === s.id) ? s : null;
  }

  function logout() {
    try { localStorage.removeItem(KEYS.session); } catch { /* ignore */ }
    location.replace('index.html');
  }

  const loadData = () => { const u = currentUser(); return u ? read('sf_data_' + u.id, {}) : {}; };
  const saveData = (data) => { const u = currentUser(); return u ? write('sf_data_' + u.id, data) : false; };

  function guard() {
    const mode = document.body.dataset.auth;
    const user = currentUser();
    if (mode === 'guest' && user) location.replace('home.html');
    if (mode === 'required' && !user) location.replace('index.html');
  }

  const ICONS = {
    dark:  { src: 'Sun.jpeg', alt: 'Sun',  label: 'Switch to light theme' },
    light: { src: 'dark.png', alt: 'Moon', label: 'Switch to dark theme' }
  };

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem(KEYS.theme, theme); } catch { /* ignore */ }
    const btn = document.getElementById('theme-toggle');
    const img = document.getElementById('theme-toggle-img');
    if (!btn || !img) return;
    img.src = ICONS[theme].src;
    img.alt = ICONS[theme].alt;
    btn.setAttribute('aria-label', ICONS[theme].label);
    btn.title = ICONS[theme].label;
  }

  function initTheme() {
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    });
  }

  return { registerUser, login, logout, currentUser, loadData, saveData, guard, initTheme, isValidEmail, MIN_PASSWORD };
})();

function initSignin() {
  const form = document.getElementById('signin-form');
  if (!form) return;

  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const emailErr = document.getElementById('email-error');
  const passErr = document.getElementById('password-error');
  const message = document.getElementById('form-message');
  const button = document.getElementById('signin-btn');

  const setMessage = (text, info = false) => {
    message.textContent = text;
    message.classList.toggle('is-info', info);
  };
  const setError = (input, target, text) => {
    target.textContent = text;
    input.setAttribute('aria-invalid', text ? 'true' : 'false');
  };

  // Shown after signup.html redirects here with ?registered=1
  if (new URLSearchParams(location.search).get('registered') === '1') {
    setMessage('Account created. Sign in to continue.', true);
  }

  email.addEventListener('input', () => { setError(email, emailErr, ''); setMessage(''); });
  password.addEventListener('input', () => { setError(password, passErr, ''); setMessage(''); });

  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    setMessage('Password recovery is coming soon.', true);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setMessage('');

    let valid = true;
    if (!SF.isValidEmail(email.value)) { setError(email, emailErr, 'Enter a valid email address.'); valid = false; }
    if (!password.value) { setError(password, passErr, 'Enter your password.'); valid = false; }
    if (!valid) {
      (email.getAttribute('aria-invalid') === 'true' ? email : password).focus();
      return;
    }

    button.disabled = true;
    const result = await SF.login(email.value, password.value);
    if (result.ok) {
      location.replace('home.html');
    } else {
      setMessage(result.error);
      button.disabled = false;
    }
  });
}

/* ---------- start ---------- */
SF.guard();
SF.initTheme();
initSignin();
</script>
</body>
</html>
